name: Build ReelCut

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  apk:
    name: Signed APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Keystore
        env:
          KS_B64: ${{ secrets.RC_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/rc.jks"
            echo "RC_KEYSTORE=$RUNNER_TEMP/rc.jks" >> "$GITHUB_ENV"
          else
            echo "Using the keystore in the repo"
          fi
      - name: Build release APK
        env:
          RC_STORE_PASS: ${{ secrets.RC_STORE_PASS }}
          RC_KEY_ALIAS: ${{ secrets.RC_KEY_ALIAS }}
          RC_KEY_PASS: ${{ secrets.RC_KEY_PASS }}
          VERSION_CODE: ${{ github.run_number }}
        run: gradle --no-daemon testDebugUnitTest assembleRelease
      - name: Name APK
        run: cp app/build/outputs/apk/release/app-release.apk "ReelCut-1.0.${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: ReelCut-apk
          path: ReelCut-*.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" ReelCut-*.apk \
            --title "ReelCut 1.0.${{ github.run_number }}" \
            --notes "Internal build from ${GITHUB_SHA::7}. Download the APK on your phone and install."

  emulator:
    name: Emulator render test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build debug and test APKs
        run: gradle --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/emu-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-output
          path: emu-out/
