# ReelCut for iPhone (owner, 23 Nov 2026): the same app as Android, built on a Mac by .github/workflows/ios.yml.
# Generate the Xcode project with:  brew install xcodegen && xcodegen generate
name: ReelCut
options:
  bundleIdPrefix: com.srisomesh
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_PREVIEWS: NO
targets:
  ReelCut:
    type: application
    platform: iOS
    sources:
      - ReelCut
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.srisomesh.reelcut
        PRODUCT_NAME: ReelCut
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Core Image kernels written in Metal (Engine/Kernels.ci.metal)
        MTL_COMPILER_FLAGS: -fcikernel
        MTLLINKER_FLAGS: -cikernel
    info:
      path: ReelCut/Info.plist
      properties:
        CFBundleDisplayName: ReelCut
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSPhotoLibraryAddUsageDescription: ReelCut saves the reels you export to your Photos.
        NSPhotoLibraryUsageDescription: ReelCut opens the clips and photos you pick to make reels.
  ReelCutTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ReelCutTests
        excludes: ["Assets/**"]
      - path: ReelCutTests/Assets
        buildPhase: resources
    dependencies:
      - target: ReelCut
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.srisomesh.reelcut.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/ReelCut.app/ReelCut
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  ReelCut:
    build:
      targets:
        ReelCut: all
        ReelCutTests: [test]
    test:
      targets:
        - ReelCutTests
